general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; sleep 1 && hyprpanel -q; hyprpanel &
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Turn off screen 5 seconds after idle (only while locked)
listener {
    timeout = 60
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
